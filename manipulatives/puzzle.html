<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Math Puzzle · OAO</title>
<link rel="stylesheet" href="lib.css">
<style>
.pz-page{max-width:820px;margin:0 auto;padding:1rem}
.pz{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:1.1rem 1.2rem;margin:0 0 1rem}
.pz-head h2{margin:0 0 .3rem;color:var(--navy);font-size:1.4rem}
.pz-rules{margin:.2rem 0 .8rem;color:var(--ink);font-weight:600}
.pz-riddle{font-size:1.25rem;font-weight:700;margin:.4rem 0 1rem;line-height:1.5}
.pz-grid{border-collapse:collapse;margin:.4rem auto 1rem;border:4px solid var(--navy)}
.pz-grid td{width:64px;height:64px;border:1.5px solid #9AA3B8;text-align:center;vertical-align:middle;position:relative;padding:0;background:#fff}
.pz-grid.n6 td{width:54px;height:54px}
.pz-grid td.br{border-right:4px solid var(--navy)}
.pz-grid td.bb{border-bottom:4px solid var(--navy)}
.pz-grid input,.pz-brick input,.pz-ans input{width:100%;height:100%;border:0;text-align:center;font:inherit;font-size:1.6rem;font-weight:800;color:var(--violet);background:transparent;outline:none}
.pz-grid input:focus,.pz-brick input:focus,.pz-ans input:focus{background:var(--yellow-l)}
.pz-grid input.bad,.pz-brick input.bad,.pz-ans input.bad{background:#FDE2DF}
.pz-given{font-size:1.6rem;font-weight:800;color:var(--navy)}
.pz-cage{position:absolute;top:2px;left:4px;font-size:.78rem;font-weight:800;color:var(--navy)}
.pz-grid.magic td{width:78px;height:78px}
.pz-pyr{display:flex;flex-direction:column;align-items:center;gap:6px;margin:.4rem 0 1rem}
.pz-row{display:flex;gap:6px}
.pz-brick{width:76px;height:52px;border:3px solid #B5651D;border-radius:6px;background:#FCE9D9;display:flex;align-items:center;justify-content:center}
.pz-target{text-align:center;font-size:1.3rem;margin:.2rem 0 .6rem}
.pz-target b{font-size:2.4rem;color:var(--violet);display:inline-block;margin-left:.3rem}
.pz-cards,.pz-ops{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin:.5rem 0}
.pz-card{width:72px;height:96px;border-radius:12px;border:3px solid var(--navy);background:#fff;font-size:2rem;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--navy)}
.pz-card:disabled{opacity:.35;box-shadow:none;cursor:default}
.pz-op{min-width:52px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.3rem;font-weight:800;cursor:pointer}
.pz-line{min-height:56px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800;margin:.6rem 0;padding:.3rem;text-align:center}
.pz-line .muted{color:var(--mute);font-size:1rem;font-weight:600}
.pz-writeline{font-size:1.1rem;margin:1rem 0}
.pz-scales{display:flex;flex-direction:column;gap:.6rem;align-items:center;margin:.4rem 0 1rem}
.pz-scale{display:flex;align-items:center;gap:.8rem;background:var(--bg);border-radius:14px;padding:.4rem .9rem}
.pz-scale .pan{display:flex;gap:4px;align-items:center;min-height:40px}
.pz-scale .num{font-size:1.6rem;font-weight:800;color:var(--navy)}
.pz-scale .eq{font-size:1.6rem;font-weight:800;color:var(--mute)}
.pz-ans{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;align-items:center;margin:.4rem 0 .8rem;font-weight:800;font-size:1.1rem}
.pz-shapein{display:inline-flex;align-items:center;gap:.3rem}
.pz-ans input{width:76px;height:52px;border:2px solid var(--line);border-radius:10px}
.pz-ans input.wide{width:120px}
.pz-actions{justify-content:center}
.pz-msg{text-align:center;font-weight:800;min-height:1.5em;margin:.6rem 0 0}
.pz-msg.ok{color:var(--green);font-size:1.2rem}
.pz-msg.hint{color:#B45309}
.pz.solved{box-shadow:0 0 0 4px var(--green),var(--shadow)}
.pz-answer{margin-top:.8rem;background:var(--yellow-l);border-radius:12px;padding:.5rem .8rem}
.pz-answer summary{cursor:pointer;font-weight:800;color:#8a6400}
.pz-answer div{margin-top:.4rem;font-family:ui-monospace,Consolas,monospace;font-size:1rem}
.pz-namebar{display:none}
.pz-print .pz-grid td{width:56px;height:56px}
@media (max-width:520px){.pz-grid td{width:52px;height:52px}.pz-grid.n6 td{width:44px;height:44px}.pz-grid.n6 input,.pz-grid.n6 .pz-given{font-size:1.25rem}.pz-brick{width:58px}.pz-card{width:60px;height:82px}}
@media print{
  body{background:#fff}.om-top,.om-noprint{display:none!important}
  .pz{box-shadow:none;border:1px solid #999;break-inside:avoid;page-break-inside:avoid}
  .pz-namebar{display:flex;justify-content:space-between;border-bottom:2px solid #000;margin-bottom:8px;padding-bottom:4px;font-size:14px}
  .pz-pack .pz{page-break-after:always}
  .pz-answers{page-break-before:always}
}
</style>
</head>
<body>
<header class="om-top" id="top"></header>
<main class="pz-page" id="main"></main>
<script src="vendor/qrcode.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="puzzles.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), st = q.get('st') === '1', printMode = q.get('print') === '1';
  var P = OAOM_PUZZLES, main = document.getElementById('main'), top = document.getElementById('top');
  function esc(t) { return OAOM.esc(t); }
  var ids = q.get('pack') ? q.get('pack').split(',') : [q.get('p')];
  var list = ids.map(function (id) { return P.get(id); }).filter(Boolean);
  var title = q.get('pack') ? (q.get('title') || 'Party pack') : (list[0] ? list[0].title : 'Puzzle');
  document.title = title + ' · OAO Math Puzzles';
  var base = location.href.split('#')[0].split('?')[0].replace(/[^\/]*$/, '');
  top.innerHTML = (st ? '' : '<a class="back" href="index.html">← Library</a>') + '<h1>' + esc(title) + '</h1><div class="om-actions">' +
    '<button class="om-btn small" id="pr">🖨 <span class="lbl">Print</span></button>' + (st || printMode ? '' : '<a class="om-btn small" id="ws" href="#">📄 <span class="lbl">Worksheet</span></a>') + (st ? '' : '<button class="om-btn small primary" id="sh">🔗 <span class="lbl">Share</span></button>') + '</div>';
  if (!list.length) { main.innerHTML = '<p>That puzzle was not found.</p>'; return; }
  document.getElementById('pr').onclick = function () { window.print(); };
  /* a printable worksheet of the same puzzle(s), with the answer key on the last page (print mode only with &print=1; student links stay interactive) */
  var ws = document.getElementById('ws'); if (ws) ws.href = location.href.split('#')[0] + (location.search ? '&' : '?') + 'print=1';
  var sh = document.getElementById('sh');
  if (sh) sh.onclick = function () {
    var u = base + 'puzzle.html?' + (q.get('pack') ? 'pack=' + encodeURIComponent(ids.join(',')) + '&title=' + encodeURIComponent(title) : 'p=' + encodeURIComponent(ids[0]));
    OAOM.share({ title: title, url: u, note: 'Students get the puzzle without the answer and without a way back to the library.', dir: { title: 'Math puzzle: ' + title, intro: 'Solve the puzzle. Tap Check when you are done. Stuck? Tap Need a hint.' } });
  };
  var toolURL = function (t, s) { return OAOM.toolURL(t, s, st ? '&st=1' : ''); };
  if (printMode) main.classList.add('pz-pack');
  list.forEach(function (p) {
    var box = document.createElement('section'); main.appendChild(box);
    P.render(box, p, { teacher: !st && !printMode, print: printMode, toolURL: toolURL });
    var nb = document.createElement('div'); nb.className = 'pz-namebar'; nb.innerHTML = '<span><b>Math puzzle</b></span><span>Name: ____________________ &nbsp; Date: ________</span>'; box.insertBefore(nb, box.firstChild);
  });
  if (printMode && !st) {
    var a = document.createElement('section'); a.className = 'pz pz-answers';
    a.innerHTML = '<h2 style="margin-top:0">Answer key (teacher)</h2>' + list.map(function (p) { var d = document.createElement('div'); P.render(d, p, { teacher: true, print: true }); var ans = d.querySelector('.pz-answer div'); return '<p><b>' + esc(p.title) + ':</b><br>' + (ans ? ans.innerHTML : '') + '</p>'; }).join('');
    main.appendChild(a);
  }
})();
</script>
</body>
</html>
