<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fact Check · OAO Math Tools</title>
<link rel="stylesheet" href="lib.css">
<style>
.fl-wrap{max-width:1100px;margin:0 auto;padding:1rem}
.fl-card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:1.1rem 1.2rem;margin:0 0 1rem}
.fl-card h2{margin:0 0 .5rem;color:var(--navy);font-size:1.25rem}
.fl-card h3{font-family:'Nunito',sans-serif;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:1rem 0 .4rem}
.fl-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1rem;align-items:start}
.fl-chips{display:flex;flex-wrap:wrap;gap:.35rem}
.fl-chips button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:.35em .85em;font-weight:700;cursor:pointer;min-height:40px}
.fl-chips button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.fl-goal{margin:.9rem 0 0;padding:.6rem .8rem;border-radius:12px;background:var(--green-l);font-size:.95rem}
.fl-goal b{color:var(--green)}
.fl-sum{margin:.8rem 0 0;font-weight:700;color:var(--navy)}
.fl-notes{font-size:.95rem}
.fl-notes p{margin:.35rem 0}
.fl-notes ul{margin:.3rem 0 .5rem 1.2rem;padding:0}
.fl-notes li{margin:.2rem 0}
.fl-src{font-size:.85rem;color:var(--mute)}
/* student */
.fl-stage{max-width:620px;margin:0 auto;text-align:center}
.fl-start .big{font-family:'Lora',Georgia,serif;font-size:2rem;color:var(--navy);margin:.2rem 0 .4rem}
.fl-bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden;margin:.2rem 0 .8rem}
.fl-bar>span{display:block;height:100%;background:var(--green);width:100%;transition:width 1s linear}
.fl-count{color:var(--mute);font-weight:700;margin:0 0 .3rem}
.fl-fact{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(2.6rem,11vw,4.6rem);color:var(--navy);margin:.2rem 0 .6rem;display:flex;align-items:center;justify-content:center;gap:.35em;flex-wrap:wrap}
.fl-ans{min-width:2.4em;border-bottom:6px solid var(--violet);color:var(--violet);padding:0 .1em;min-height:1.2em;display:inline-block}
.fl-fb{min-height:2.2rem;font-size:1.3rem;font-weight:800;margin:0 0 .4rem}
.fl-fb.ok{color:var(--green)}
.fl-fb.no{color:#B45309}
.fl-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;max-width:340px;margin:0 auto}
.fl-pad button{min-height:62px;font-size:1.6rem;font-weight:800;border-radius:16px;border:2px solid var(--line);background:#fff;cursor:pointer;color:var(--navy)}
.fl-pad button:active{background:var(--violet-l)}
.fl-pad .go{background:var(--green);border-color:var(--green);color:#fff}
.fl-pad .del{font-size:1.3rem}
.fl-pad button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
/* score */
.fl-score{text-align:left}
.fl-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin:.6rem 0 1rem}
.fl-stat{border-radius:14px;padding:.7rem .8rem;background:var(--bg);text-align:center}
.fl-stat b{display:block;font-size:2rem;font-family:'Lora',Georgia,serif;color:var(--navy)}
.fl-stat.fast{background:var(--green-l)} .fl-stat.fast b{color:var(--green)}
.fl-stat.strat{background:var(--yellow-l)} .fl-stat.strat b{color:#8a6400}
.fl-stat.miss{background:var(--violet-l)} .fl-stat.miss b{color:var(--violet)}
.fl-prac{margin:.3rem 0 .8rem 0;padding:0;list-style:none}
.fl-prac li{padding:.45rem .6rem;border-top:1px solid var(--line)}
.fl-prac li b{color:var(--navy);margin-right:.4rem}
.fl-faces{display:flex;flex-wrap:wrap;gap:.4rem}
.fl-faces button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:.45em .8em;font-weight:700;cursor:pointer;min-height:44px}
.fl-faces button[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-l)}
.fl-cn{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;margin:.8rem 0}
.fl-cn input{width:5.5em;border:2px solid var(--line);border-radius:10px;padding:.3em .5em;min-height:40px;font-size:1rem}
.fl-ro{background:var(--yellow-l);border-radius:12px;padding:.5rem .8rem;font-weight:700;margin:0 0 .8rem}
@media (max-width:820px){.fl-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.fl-bar>span{transition:none}}
</style>
</head>
<body>
<header class="om-top" id="fl-top"><a class="back om-noprint" href="index.html" id="fl-back">← Library</a><h1>Fact Check</h1><div class="om-actions" id="fl-actions"></div></header>
<main class="fl-wrap" id="fl-app"></main>
<script src="vendor/qrcode.js"></script>
<script src="core.js"></script>
<script src="fluency.js"></script>
</body>
</html>
